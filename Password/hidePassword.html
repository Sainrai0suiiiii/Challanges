<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide Password</title>
    <style>
        * { box-sizing: border-box; }
 
	body {
		min-height: 100vh;
		margin: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #12141c;
		font-family: -apple-system, "Segoe UI", sans-serif;
	}
 
	.card {
		width: 340px;
		background: #1c1f2b;
		padding: 32px 28px;
		border-radius: 16px;
		box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
	}
 
	h2 {
		margin: 0 0 22px;
		color: #eef0f7;
		font-size: 20px;
	}
 
	label {
		display: block;
		margin-bottom: 6px;
		color: #b9bfd1;
		font-size: 14px;
	}
 
	.field {
		position: relative;
	}
 
	#passwordInput {
		width: 100%;
		padding: 12px 74px 12px 14px;
		font-size: 15px;
		letter-spacing: 1px;
		border-radius: 8px;
		border: 1px solid #3a4159;
		background: #262b3a;
		color: #eef0f7;
		outline: none;
	}
 
	#passwordInput:focus {
		border-color: #4fd6c0;
	}
 
	#toggleBtn {
		position: absolute;
		right: 6px;
		top: 50%;
		transform: translateY(-50%);
		padding: 8px 12px;
		font-size: 13px;
		font-weight: 600;
		color: #0b2b26;
		background: #4fd6c0;
		border: none;
		border-radius: 6px;
		cursor: pointer;
		display: flex;
		align-items: center;
		gap: 5px;
	}
 
	#toggleBtn:hover {
		filter: brightness(1.08);
	}
 
	.hint {
		margin-top: 10px;
		color: #6b7185;
		font-size: 12px;
	}

    </style>
</head>
<body>
    <div class ="card">
        <h2>Password field</h2>
        <label for="passwordInput">Password</label>
        <div class="field">
            <input type="password" id="passwordInput" placeholder="Enter your Password">
            <button id="toggleBtn" type="button">
               	<span id="toggleIcon">👁</span>
			    <span id="toggleText">Show</span>
            </button>
        </div>
        <div class="hint">Click the button to reveal or hide your password.</div>
    </div>
    <script>
        const passwordInput = document.getElementById("passwordInput");
        const toggleBtn = document.getElementById("toggleBtn");
        const toggleIcon = document.getElementById("toggleIcon");
        const toggleText = document.getElementById("toggleText");

        toggleBtn.addEventListener("click", function(){
            const isPassword = passwordInput.type === "password";
            
            //flip the input tyype between password and text
            passwordInput.type = isPassword ? "text": "password";

            // flip the button's icon and label to match the new state
		    toggleIcon.textContent = isPassword ? "🙈" : "👁";
		    toggleText.textContent = isPassword ? "Hide" : "Show";
        })
    </script>
    
</body>
</html>
