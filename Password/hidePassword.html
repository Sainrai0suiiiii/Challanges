<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide Password</title>
    <style>

    </style>
</head>
<body>
    <div class ="card">
        <h2>Password field</h2>
        <label for="passwordInput">Password</label>
        <div class="field">
            <input type="password" id="passwordInput" placeholder="Enter your Password">
            <button id="toggleBtn" type="button">
               	<span id="toggleIcon">👁</span>
			    <span id="toggleText">Show</span>
            </button>
        </div>
        <div class="hint">Click the button to reveal or hide your password.</div>
    </div>
    <script>
        const passwordInput = document.getElementById("passwordInput");
        const toggleBtn = document.getElementById("toggleBtn");
        const toggleIcon = document.getElementById("toggleIcon");
        const toggleText = document.getElementById("toggleText");

        toggleBtn.addEventListener("click", function(){
            const isPassword = passwordInput.type === "password";
            
            //flip the input tyype between password and text
            passwordInput.type = isPassword ? "text": "password";

            // flip the button's icon and label to match the new state
		    toggleIcon.textContent = isPassword ? "🙈" : "👁";
		    toggleText.textContent = isPassword ? "Hide" : "Show";
        })
    </script>
    
</body>
</html>
