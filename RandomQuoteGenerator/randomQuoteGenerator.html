<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <style>
        * { box-sizing: border-box; }
 
	body {
		min-height: 100vh;
		margin: 0;
		display: flex;
		align-items: center;
		justify-content: center;
		background: #12141c;
		font-family: -apple-system, "Segoe UI", sans-serif;
		padding: 24px;
	}
 
	.card {
		width: 420px;
		background: #1c1f2b;
		padding: 40px 32px;
		border-radius: 16px;
		box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
		text-align: center;
	}
 
	.mark {
		font-size: 44px;
		line-height: 1;
		color: #4fd6c0;
		margin-bottom: 6px;
	}
 
	#quoteText {
		font-size: 19px;
		line-height: 1.5;
		color: #eef0f7;
		min-height: 90px;
		display: flex;
		align-items: center;
		justify-content: center;
		transition: opacity 0.2s ease;
	}
 
	#quoteAuthor {
		margin-top: 14px;
		color: #4fd6c0;
		font-size: 14px;
		font-weight: 600;
		transition: opacity 0.2s ease;
	}
 
	.actions {
		margin-top: 28px;
		display: flex;
		gap: 10px;
		justify-content: center;
	}
 
	button {
		display: inline-flex;
		align-items: center;
		gap: 8px;
		padding: 12px 20px;
		font-size: 14px;
		font-weight: 600;
		border: none;
		border-radius: 8px;
		cursor: pointer;
		transition: filter 0.15s ease, background 0.15s ease;
	}
 
	#newQuoteBtn {
		color: #0b2b26;
		background: #4fd6c0;
	}
 
	#newQuoteBtn:hover {
		filter: brightness(1.08);
	}
 
	#copyBtn {
		color: #eef0f7;
		background: #262b3a;
		border: 1px solid #3a4159;
	}
 
	#copyBtn:hover {
		background: #313850;
	}
 
	.fade {
		opacity: 0;
	}

    </style>
</head>
<body>
    <div class="card">
        <div class="mark">"</div>
        <div id="quoteText">Loading</div>
        <div id="quoteAuthor"></div>

        <div class="actions">
            <button id="newQuoteBtn">🔁 New Quote</button>
		    <button id="copyBtn">📋 Copy</button>
        </div>
    </div>
    <script>
        const quotes = [
            {text:"The only way to do great work is love what you do.", author:"steve jobs"},
            {text: "Code is like humor. When you have to explain it, it's bad.", author:"John Johnson"},
            {text:"First, solve the problem. Then, write the code.", author: "Austin freeman"},
            {text: "Make it work,make it right, make it fast.", author: "kent back"},
            {text:"The best error message is the one that never shows up.", author:"thomas fuchs"},
            {text:"Talk is cheap. Show me the code.", author:"Linus Torvalds"},
            {text:"Sathi bhaneko guff puff ra jhaks ma kam lagne hunu paro natra kam xaina.",author:"Sain kulung"},
            {text:"jindagi aaja xa bholi xaina.",author:"Samir Raut"},
            {text:"tesailay 2 din ko jindagima ramau.",author:"Samir Raut"},

        ];
    const quoteText = document.getElementById("quoteText");
	const quoteAuthor = document.getElementById("quoteAuthor");
	const newQuoteBtn = document.getElementById("newQuoteBtn");
	const copyBtn = document.getElementById("copyBtn");
 
	let currentIndex = -1;
 
	function showRandomQuote() {
		// fade out first
		quoteText.classList.add("fade");
		quoteAuthor.classList.add("fade");
 
		setTimeout(function () {
			let index;
			do {
				index = Math.floor(Math.random() * quotes.length);
			} while (index === currentIndex && quotes.length > 1);
 
			currentIndex = index;
			quoteText.textContent = quotes[index].text;
			quoteAuthor.textContent = "— " + quotes[index].author;
 
			// fade back in
			quoteText.classList.remove("fade");
			quoteAuthor.classList.remove("fade");
		}, 200);
	}
 
	function copyQuote() {
		const fullQuote = quoteText.textContent + " " + quoteAuthor.textContent;
		navigator.clipboard.writeText(fullQuote).then(function () {
			const original = copyBtn.textContent;
			copyBtn.textContent = "✅ Copied";
			setTimeout(function () {
				copyBtn.textContent = original;
			}, 1200);
		});
	}
 
	newQuoteBtn.addEventListener("click", showRandomQuote);
	copyBtn.addEventListener("click", copyQuote);
 
	showRandomQuote();

    </script>
    
</body>
</html>
